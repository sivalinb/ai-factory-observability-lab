{
  "global": {
    "scrape_interval": "5s",
    "evaluation_interval": "5s"
  },
  "rule_files": [
    "/etc/prometheus/rules.yml"
  ],
  "alerting": {
    "alertmanagers": [
      {
        "static_configs": [
          {
            "targets": [
              "alertmanager:9093"
            ]
          }
        ]
      }
    ]
  },
  "scrape_configs": [
    {
      "job_name": "lab",
      "metrics_path": "/metrics/lab",
      "static_configs": [
        {
          "targets": [
            "lab:8090"
          ]
        }
      ]
    },
