name: Validate observability lab
on: [push, pull_request, workflow_dispatch]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/build.py
      - run: python -m unittest discover -s tests -v
      - run: git diff --exit-code -- dashboards catalog docs/signals.md docs/alerts.md config
      - name: Check Prometheus config and rules
        run: docker run --rm --entrypoint promtool -v "$PWD/config:/etc/prometheus:ro" prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: docker compose up --build -d
      - name: Wait for services
        run: |
          for attempt in $(seq 1 40); do
            if curl -fsS http://localhost:3000/api/health && curl -fsS http://localhost:8090/health && curl -fsS http://localhost:9090/-/ready; then break; fi
            sleep 3
          done
          sleep 15
      - run: python scripts/verify.py --faults --output reports/verification.local.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-report
          path: reports/verification.local.json
      - run: docker compose logs --no-color
        if: failure()
      - run: docker compose down
        if: always()
